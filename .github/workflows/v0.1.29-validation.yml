name: v0.1.29 custom validation

on:
  push:
    branches:
      - integration/v0.1.29-custom
    paths:
      - '**'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  host:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install jinja2 regex numpy
      - run: sudo apt-get update -qq && sudo apt-get install -y libssl-dev
      - name: Verify upstream base
        run: |
          git merge-base --is-ancestor d6708a4aae15b4860000d54c8af9e84d684bce09 HEAD
          test "$(git merge-base d6708a4aae15b4860000d54c8af9e84d684bce09 HEAD)" = d6708a4aae15b4860000d54c8af9e84d684bce09
          git diff --check d6708a4aae15b4860000d54c8af9e84d684bce09..HEAD
      - name: Host cache and correctness suites
        run: |
          cmake -S . -B build-host -DCMAKE_BUILD_TYPE=Debug             -DSTRATA_ENABLE_CUDA=OFF -DSTRATA_ENABLE_HIP=OFF             -DSTRATA_NATIVE_EXPERTS=OFF -DSTRATA_BUILD_TESTS=OFF             -DSTRATA_BUILD_CONVERSATION_TESTS=ON -DSTRATA_ENABLE_CONVERSATION_DISK=ON
          cmake --build build-host -j2 --target             conversation_cache_test conversation_memory_test conversation_file_test             shared_conversation_store_test conversation_io_cancel_test checkpoint_records_test             checkpoint_staging_test conv_cache_test conv_cache_policy_test request_stop_test             prefix_file_test conversation_store_test bf16_bits_test
          ctest --test-dir build-host --output-on-failure
      - name: Python server/cache suites
        run: |
          python -m unittest discover -s serve -p 'test_*.py'
          python -m unittest discover -s tests -p 'test_*.py'
          python -m unittest discover -s tools -p 'test_conversation_cache_*.py'
          python -O -m unittest discover -s tools -p 'test_conversation_cache_*.py'
          python -m unittest discover -s tools -p 'test_cache_fork_integration.py'

  cuda13:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    container:
      image: nvidia/cuda:13.0.1-devel-ubuntu24.04
    steps:
      - name: Dependencies
        run: |
          apt-get update -qq
          DEBIAN_FRONTEND=noninteractive apt-get install -y -qq git cmake ninja-build g++ libssl-dev python3
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Fetch pinned llama.cpp
        run: |
          git init /tmp/llama
          git -C /tmp/llama fetch --depth=1 https://github.com/ggml-org/llama.cpp.git 3cf03257f219afbe7334045ff7c6a06ac68c627d
          git -C /tmp/llama checkout --detach FETCH_HEAD
      - name: CUDA 13 SM120 full build
        run: |
          cmake -S . -B build-cuda -G Ninja             -DCMAKE_BUILD_TYPE=Release             -DSTRATA_ENABLE_CUDA=ON -DSTRATA_ENABLE_HIP=OFF             -DCMAKE_CUDA_ARCHITECTURES=120             -DSTRATA_PORTABLE=ON -DSTRATA_NATIVE_EXPERTS=ON             -DSTRATA_BUILD_TESTS=OFF -DSTRATA_BUILD_CONVERSATION_TESTS=ON             -DSTRATA_ENABLE_CONVERSATION_DISK=ON             -DSTRATA_GGML_DIR=/tmp/llama
          cmake --build build-cuda -j2 --target strata conversation_validation_test conversation_transfer_test
          mkdir -p /tmp/cuda-stubs
          ln -sf /usr/local/cuda/lib64/stubs/libcuda.so /tmp/cuda-stubs/libcuda.so.1
          export LD_LIBRARY_PATH="/tmp/cuda-stubs:/usr/local/cuda/lib64:${LD_LIBRARY_PATH:-}"
          CUDA_VISIBLE_DEVICES=-1 ctest --test-dir build-cuda             -R '^(conversation_validation_test|conversation_transfer_test)$' --output-on-failure
          ./build-cuda/strata --help >/dev/null
          cmake -S . -B build-cuda -DSTRATA_ENABLE_CONVERSATION_DISK=OFF
          cmake --build build-cuda -j2 --target strata
