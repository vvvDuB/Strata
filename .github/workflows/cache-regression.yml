name: Cache regressions
on:
  pull_request:
    paths:
      - 'src/core/conversation*'
      - 'src/platform/conversation*'
      - 'src/program/**'
      - 'include/strata/**'
      - 'serve/**'
      - 'tests/**'
      - 'tools/*cache*'
      - 'CMakeLists.txt'
      - '.github/workflows/cache-regression.yml'
permissions:
  contents: read
jobs:
  host:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install jinja2 regex numpy
      - name: OpenSSL development dependency
        run: sudo apt-get update -qq && sudo apt-get install -y libssl-dev
      - name: Shared and fork host cache suites
        run: |
          cmake -S . -B build-cache-host -DCMAKE_BUILD_TYPE=Debug -DSTRATA_ENABLE_CUDA=OFF -DSTRATA_ENABLE_HIP=OFF \
            -DSTRATA_NATIVE_EXPERTS=OFF -DSTRATA_BUILD_TESTS=OFF \
            -DSTRATA_BUILD_CONVERSATION_TESTS=ON -DSTRATA_ENABLE_CONVERSATION_DISK=ON
          cmake --build build-cache-host -j2 --target conversation_cache_test conversation_memory_test \
            conversation_file_test shared_conversation_store_test conversation_io_cancel_test \
            checkpoint_records_test checkpoint_staging_test conv_cache_test conv_cache_policy_test \
            request_stop_test prefix_file_test conversation_store_test
          ctest --test-dir build-cache-host --output-on-failure
      - name: Serving and replay contracts
        run: |
          python -m unittest discover -s serve -p 'test_*.py'
          python -m unittest discover -s tests -p 'test_*.py'
          python -m unittest discover -s tools -p 'test_conversation_cache_*.py'
          python -O -m unittest discover -s tools -p 'test_conversation_cache_*.py'
          python -m unittest discover -s tools -p 'test_cache_fork_integration.py'
